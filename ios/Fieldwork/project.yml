name: Fieldwork
options:
  bundleIdPrefix: tech.skinetics
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FieldworkKit:
    path: ../../fieldwork/swift/FieldworkKit

targets:
  Fieldwork:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Fieldwork
    dependencies:
      - package: FieldworkKit
    info:
      path: Sources/Fieldwork/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Fieldwork
        UIUserInterfaceStyle: Automatic
        NSLocationWhenInUseUsageDescription: "Fieldwork uses your location to figure out what's visible in the sky above you."
        NSCameraUsageDescription: "Fieldwork can use the camera to help you point at the sky while scanning."
        NSPhotoLibraryUsageDescription: "Fieldwork can identify what's in a sky photo you already took."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.skinetics.fieldwork
        PRODUCT_NAME: Fieldwork
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
